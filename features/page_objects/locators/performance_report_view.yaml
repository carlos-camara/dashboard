performance_report_view:
  audit_title:
    type: text
    by: xpath
    value: //*[@data-testid='performance-audit-title']
    wait_load: true
  rps_section:
    type: text
    by: xpath
    value: //h3[contains(., 'Requests per Second')]
    wait_load: false
  latency_section:
    type: text
    by: xpath
    value: //h3[contains(., 'Response Times')]
    wait_load: false
  rps_image:
    type: webelement
    by: xpath
    value: //h3[contains(., 'Traffic') and contains(., 'Velocity')]/ancestor::div[contains(@class, 'bg-slate-900/40')]
    wait_load: false
  latency_image:
    type: webelement
    by: xpath
    value: //h3[contains(., 'Spectral') and contains(., 'Latency')]/ancestor::div[contains(@class, 'bg-slate-900/40')]
    wait_load: false
  audit_timestamp_value:
    type: text
    by: xpath
    value: //span[contains(text(), 'Timestamp Reference')]/following-sibling::div
    wait_load: false
  endpoint_matrix:
    type: webelement
    by: xpath
    value: //h3[contains(., 'Endpoint') and contains(., 'Matrix')]/ancestor::div[contains(@class, 'bg-slate-900/40')]
    wait_load: false
  audit_matrix:
    type: text
    by: xpath
    value: //h3[contains(., 'Audit')]
    wait_load: false
  summary_efficiency:
    type: text
    by: xpath
    value: //*[@data-testid='summary-efficiency']
    wait_load: false
  summary_velocity:
    type: text
    by: xpath
    value: //*[@data-testid='summary-velocity']
    wait_load: false
  summary_integrity:
    type: text
    by: xpath
    value: //*[@data-testid='summary-integrity']
    wait_load: false
  summary_saturation:
    type: text
    by: xpath
    value: //*[@data-testid='summary-saturation']
    wait_load: false
  efficiency_score:
    type: text
    by: xpath
    value: //span[contains(normalize-space(.), 'Throughput')]/ancestor::div[contains(@class, 'p-6')]//div[contains(@class, 'text-4xl')]
    wait_load: false
  velocity_score:
    type: text
    by: xpath
    value: //span[contains(normalize-space(.), 'Latency Mean')]/ancestor::div[contains(@class, 'p-6')]//div[contains(@class, 'text-4xl')]
    wait_load: false
  integrity_score:
    type: text
    by: xpath
    value: //span[contains(normalize-space(.), 'Integrity')]/ancestor::div[contains(@class, 'p-6')]//div[contains(@class, 'text-4xl')]
    wait_load: false
  saturation_score:
    type: text
    by: xpath
    value: //span[contains(normalize-space(.), 'Concurrency')]/ancestor::div[contains(@class, 'p-6')]//div[contains(@class, 'text-4xl')]
    wait_load: false
  back_button:
    type: button
    by: xpath
    value: //button[./*[local-name()='svg' and contains(@class, 'lucide-chevron-left')]]
    wait_load: false
  export_button:
    type: button
    by: xpath
    value: //button[contains(., 'Dossier')]
    wait_load: false
  original_report_link:
    type: button
    by: xpath
    value: //a[contains(., 'Raw Locust Report')]
    wait_load: false
