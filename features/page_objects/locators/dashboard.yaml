dashboard:
  header_title:
    type: text
    by: css
    value: "h1.font-black" # "COMMAND\nCENTER"
  header_subtitle:
    type: text
    by: xpath
    value: "//div[contains(@class, 'text-indigo-400')]//span[contains(., 'Dashboard Cluster')]"
  header_qa_hub_text:
    type: text
    by: css
    value: "header div.text-indigo-400 span"
  
  stats_pass_rate:
    type: text
    by: xpath
    value: "//p[contains(text(), 'Pass Rate')]/ancestor::div[contains(@class, 'glass-panel')]"
  stats_total_runs:
    type: text
    by: xpath
    value: "//p[contains(text(), 'Total Executions')]/ancestor::div[contains(@class, 'glass-panel')]"
  stats_avg_duration:
    type: text
    by: xpath
    value: "//p[contains(text(), 'Avg Latency')]/ancestor::div[contains(@class, 'glass-panel')]"
  stats_passed_card:
    type: text
    by: xpath
    value: "//p[contains(text(), 'System Health')]/ancestor::div[contains(@class, 'glass-panel')]"
  stats_failed_card:
    type: text
    by: xpath
    value: "//p[contains(text(), 'Incident Taxonomy')]/ancestor::div[contains(@class, 'glass-panel')]"

  status_ticker_bar:
    type: webelement
    by: css
    value: "div.animate-marquee"
  status_ticker_system_status:
    type: text
    by: xpath
    value: "//span[contains(@class, 'tracking-[0.2em]')]" # Matches specifically the status span

  timeline_heading:
    type: text
    by: xpath
    value: "//div[contains(@class, 'glass-panel')]//h3[contains(., 'Signal Velocity')]"
  timeline_chart:
    type: webelement
    by: css
    value: ".recharts-wrapper"
  timeline_toggle_success:
    type: button
    by: xpath
    value: "//button[contains(normalize-space(.), 'Stability')]"
  timeline_toggle_volume:
    type: button
    by: xpath
    value: "//button[contains(normalize-space(.), 'Volume')]"

  recent_runs_heading:
    type: text
    by: xpath
    value: "//h3[contains(., 'Sector Integrity')]"
  recent_runs_section:
    type: webelement
    by: xpath
    value: "//div[contains(., 'Sector Integrity')]"
  recent_runs_list_item:
    type: webelement
    by: xpath
    value: "//div[contains(., 'Sector Integrity')]/..//div[contains(@class, 'bg-slate-950/40')]"
  recent_runs_project_item:
    type: button
    by: xpath
    value: "//h3[contains(., 'Sector Integrity')]/ancestor::div[contains(@class, 'glass-panel')]//div[contains(@class, 'cursor-pointer')][1]"

  incidents_heading:
    type: text
    by: xpath
    value: "//h3[contains(., 'Incident Taxonomy')]"
  incidents_list_item:
    type: webelement
    by: xpath
    value: "//h3[contains(., 'Incident Taxonomy')]/ancestor::div[contains(@class, 'glass-panel')]//div[contains(@class, 'border-l-4')]"

  endpoints_heading:
    type: text
    by: xpath
    value: "//h3[contains(., 'Latency Anomalies')]"
  endpoints_catalog:
    type: webelement
    by: xpath
    value: "//h3[contains(., 'Latency Anomalies')]/ancestor::div[contains(@class, 'glass-panel')]"
  endpoints_anomaly_item:
    type: button
    by: xpath
    value: "//h3[contains(., 'Latency Anomalies')]/ancestor::div[contains(@class, 'glass-panel')]//div[contains(@class, 'cursor-pointer')][1]"

  actions_sync_button:
    type: button
    by: xpath
    value: "//button[@title='Synchronize Data']"
  actions_filter_7_days:
    type: button
    by: xpath
    value: "//button[contains(normalize-space(.), '7 Days')]"
  actions_filter_30_days:
    type: button
    by: xpath
    value: "//button[contains(normalize-space(.), '30 Days')]"
  actions_filter_all_time:
    type: button
    by: xpath
    value: "//button[@title='Generate Report']"
  actions_export_button:
    type: button
    by: xpath
    value: "//button[@title='Generate Report']"
