dashboard:
  header:
    title:
      type: text
      by: css
      value: "h1" # "COMMAND\nCENTER"
    subtitle:
      type: text
      by: css
      value: "header span.tracking-\\[0\\.2em\\]"
    qa_hub_text:
      type: text
      by: css
      value: "header div.text-indigo-400 span"
  
  stats:
    pass_rate:
      type: text
      by: xpath
      value: "//*[contains(normalize-space(.), 'PASS RATE')]"
    total_runs:
      type: text
      by: xpath
      value: "//*[contains(normalize-space(.), 'TOTAL EXECUTIONS')]"
    avg_duration:
      type: text
      by: xpath
      value: "//*[contains(normalize-space(.), 'AVG LATENCY')]"
    passed_card:
      type: text
      by: xpath
      value: "//*[contains(normalize-space(.), 'SYSTEM HEALTH')]"
    failed_card:
      type: text
      by: xpath
      value: "//*[contains(normalize-space(.), 'INCIDENT TAXONOMY')]"

  status_ticker:
    bar:
      type: webelement
      by: css
      value: "div.animate-marquee"
    system_status:
      type: text
      by: xpath
      value: "//span[contains(@class, 'tracking-[0.2em]')]" # Matches specifically the status span

  timeline:
    heading:
      type: text
      by: xpath
      value: "//*[contains(normalize-space(.), 'SIGNAL VELOCITY')]"
    chart:
      type: webelement
      by: css
      value: ".recharts-wrapper"
    toggle_success:
      type: button
      by: xpath
      value: "//button[contains(normalize-space(.), 'Stability')]"
    toggle_volume:
      type: button
      by: xpath
      value: "//button[contains(normalize-space(.), 'Volume')]"

  recent_runs:
    heading:
      type: text
      by: xpath
      value: "//*[contains(normalize-space(.), 'SECTOR INTEGRITY')]"
    section:
      type: webelement
      by: xpath
      value: "//div[contains(., 'Sector Integrity')]"
    list_item:
      type: webelement
      by: xpath
      value: "//div[contains(., 'Sector Integrity')]/..//div[contains(@class, 'bg-slate-950/40')]"
    project_item:
      type: button
      by: xpath
      value: "//h3[contains(., 'Sector Integrity')]/ancestor::div[contains(@class, 'glass-panel')]//div[contains(@class, 'cursor-pointer')][1]"

  incidents:
    heading:
      type: text
      by: xpath
      value: "//*[contains(normalize-space(.), 'INCIDENT TAXONOMY')]"
    list_item:
      type: webelement
      by: xpath
      value: "//h3[contains(., 'Incident Taxonomy')]/ancestor::div[contains(@class, 'glass-panel')]//div[contains(@class, 'border-l-4')]"

  endpoints:
    heading:
      type: text
      by: xpath
      value: "//*[contains(normalize-space(.), 'LATENCY ANOMALIES')]"
    catalog:
      type: webelement
      by: xpath
      value: "//h3[contains(., 'Latency Anomalies')]/ancestor::div[contains(@class, 'glass-panel')]"
    anomaly_item:
      type: button
      by: xpath
      value: "//h3[contains(., 'Latency Anomalies')]/ancestor::div[contains(@class, 'glass-panel')]//div[contains(@class, 'cursor-pointer')][1]"

  actions:
    sync_button:
      type: button
      by: xpath
      value: "//button[@title='Synchronize Data']"
    filter_7_days:
      type: button
      by: xpath
      value: "//button[contains(normalize-space(.), '7 Days')]"
    filter_30_days:
      type: button
      by: xpath
      value: "//button[contains(normalize-space(.), '30 Days')]"
    filter_all_time:
      type: button
      by: xpath
      value: "//button[@title='Generate Report']"
    export_button:
      type: button
      by: xpath
      value: "//button[@title='Generate Report']"
