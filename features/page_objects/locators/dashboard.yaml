dashboard:
  header_title:
    type: text
    by: css
    value: h1.font-black
    wait_load: true
  header_subtitle:
    type: text
    by: xpath
    value: //div[contains(@class, 'text-indigo-400')]//span[contains(., 'Dashboard
      Cluster')]
    wait_load: false
  header_qa_hub_text:
    type: text
    by: css
    value: header div.text-indigo-400 span
    wait_load: false
  stats_pass_rate:
    type: text
    by: xpath
    value: //p[contains(text(), 'Pass Rate')]/ancestor::div[contains(@class, 'glass-panel')]
    wait_load: false
  stats_total_runs:
    type: text
    by: xpath
    value: //p[contains(text(), 'Total Executions')]/ancestor::div[contains(@class,
      'glass-panel')]
    wait_load: false
  stats_avg_duration:
    type: text
    by: xpath
    value: //p[contains(text(), 'Avg Latency')]/ancestor::div[contains(@class, 'glass-panel')]
    wait_load: false
  stats_passed_card:
    type: text
    by: xpath
    value: //p[contains(text(), 'System Health')]/ancestor::div[contains(@class, 'glass-panel')]
    wait_load: false
  stats_failed_card:
    type: text
    by: xpath
    value: //p[contains(text(), 'Incident Taxonomy')]/ancestor::div[contains(@class,
      'glass-panel')]
    wait_load: false
  status_ticker_bar:
    type: webelement
    by: css
    value: div.animate-marquee
    wait_load: false
  status_ticker_system_status:
    type: text
    by: xpath
    value: //span[contains(@class, 'tracking-[0.2em]')]
    wait_load: false
  timeline_heading:
    type: text
    by: xpath
    value: //div[contains(@class, 'glass-panel')]//h3[contains(., 'Signal Velocity')]
    wait_load: false
  timeline_chart:
    type: webelement
    by: css
    value: .recharts-wrapper
    wait_load: true
  timeline_toggle_success:
    type: button
    by: xpath
    value: //button[contains(normalize-space(.), 'Stability')]
    wait_load: false
  timeline_toggle_volume:
    type: button
    by: xpath
    value: //button[contains(normalize-space(.), 'Volume')]
    wait_load: false
  recent_runs_heading:
    type: text
    by: xpath
    value: //h3[contains(., 'Sector Integrity')]
    wait_load: false
  recent_runs_section:
    type: webelement
    by: xpath
    value: //div[contains(., 'Sector Integrity')]
    wait_load: false
  recent_runs_list_item:
    type: webelement
    by: xpath
    value: //div[contains(., 'Sector Integrity')]/..//div[contains(@class, 'bg-slate-950/40')]
    wait_load: false
  recent_runs_project_item:
    type: button
    by: xpath
    value: //h3[contains(., 'Sector Integrity')]/ancestor::div[contains(@class, 'glass-panel')]//div[contains(@class,
      'cursor-pointer')][1]
    wait_load: false
  incidents_heading:
    type: text
    by: xpath
    value: //h3[contains(., 'Incident Taxonomy')]
    wait_load: false
  incidents_list_item:
    type: webelement
    by: xpath
    value: //h3[contains(., 'Incident Taxonomy')]/ancestor::div[contains(@class, 'glass-panel')]//div[contains(@class,
      'border-l-4')]
    wait_load: false
  endpoints_heading:
    type: text
    by: xpath
    value: //h3[contains(., 'Latency Anomalies')]
    wait_load: false
  endpoints_catalog:
    type: webelement
    by: xpath
    value: //h3[contains(., 'Latency Anomalies')]/ancestor::div[contains(@class, 'glass-panel')]
    wait_load: false
  endpoints_anomaly_item:
    type: button
    by: xpath
    value: //h3[contains(., 'Latency Anomalies')]/ancestor::div[contains(@class, 'glass-panel')]//div[contains(@class,
      'cursor-pointer')][1]
    wait_load: false
  actions_sync_button:
    type: button
    by: xpath
    value: //button[@title='Synchronize Data']
    wait_load: false
  actions_filter_7_days:
    type: button
    by: xpath
    value: //button[contains(normalize-space(.), '7 Days')]
    wait_load: false
  actions_filter_30_days:
    type: button
    by: xpath
    value: //button[contains(normalize-space(.), '30 Days')]
    wait_load: false
  actions_filter_all_time:
    type: button
    by: xpath
    value: //button[@title='Generate Report']
    wait_load: false
  actions_export_button:
    type: button
    by: xpath
    value: //button[@title='Generate Report']
    wait_load: false
