---
test_runs:
  title:
    by: xpath
    value: //main//*[self::h1 or self::h2][contains(@class, 'font-black')]
    wait_load: true
  project_title:
    type: text
    by: xpath
    value: //h3[contains(@class, 'text-2xl font-black')]
    wait_load: false
  search_input:
    type: input
    by: xpath
    value: >-
      //input[@placeholder='Search by project identifier, run ID, or tags...']
    wait_load: false
  project_card:
    type: button
    by: xpath
    value: //*[@data-testid='project-card']
    wait_load: true
  delete_project_button:
    type: button
    by: xpath
    value: //button[contains(., 'Delete Project')]
    wait_load: false
  view_analytics_button:
    type: button
    by: xpath
    value: //*[contains(text(), 'VIEW ANALYTICS')]
    wait_load: false
  active_projects_count:
    type: text
    by: xpath
    value: //p[contains(text(), 'Active Projects')]/following-sibling::p
    wait_load: true
  project_flights_count:
    type: text
    by: xpath
    value: //span[contains(., 'Flights')]/span
    wait_load: false
  project_last_activity:
    type: text
    by: xpath
    value: //span[contains(., 'Last:')]/span
    wait_load: false
  project_pass_rate:
    type: text
    by: xpath
    value: //span[contains(text(), 'Pass Rate')]/preceding-sibling::span
    wait_load: false
