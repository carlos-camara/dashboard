incidents:
  header_title:
    type: text
    by: css
    value: main h1.font-black
    wait_load: true
  header_subtitle:
    type: text
    by: css
    value: main h1.font-black
    wait_load: false
  stats_total_sign:
    type: text
    by: xpath
    value: //*[contains(normalize-space(.), 'Total Incidents')]
    wait_load: false
  stats_sectors_sign:
    type: text
    by: xpath
    value: //*[contains(normalize-space(.), 'Affected Sectors')]
    wait_load: false
  filters_scope_dropdown:
    type: button
    by: xpath
    value: //button[contains(., 'Global Scope')]
    wait_load: false
  filters_project_item:
    type: button
    by: xpath
    value: //div[contains(@class, 'absolute')]//div[contains(@class, 'cursor-pointer')]
    wait_load: false
  list_item:
    type: webelement
    by: css
    value: ".glass-panel:has(.cursor-pointer)"
    wait_load: false
  list_expand_button:
    type: button
    by: css
    value: ".glass-panel .cursor-pointer"
    wait_load: false
  list_details_context:
    type: text
    by: xpath
    value: //*[contains(normalize-space(.), 'Stack Trace Context')]
    wait_load: false
