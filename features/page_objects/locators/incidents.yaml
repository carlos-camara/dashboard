---
incidents:
  header_title:
    type: text
    by: xpath
    value: //h1[contains(., 'INCIDENT')]
    wait_load: true
  header_subtitle:
    type: text
    by: xpath
    value: //*[contains(text(), 'Anomaly Detection')]
    wait_load: false
  stats_total_sign:
    type: text
    by: xpath
    value: //p[contains(text(), 'Total Incidents')]
    wait_load: false
  stats_total_value:
    type: text
    by: xpath
    value: //p[contains(text(), 'Total Incidents')]/following-sibling::p
    wait_load: false
  stats_sectors_sign:
    type: text
    by: xpath
    value: //p[contains(text(), 'Affected Sectors')]
    wait_load: false
  stats_sectors_value:
    type: text
    by: xpath
    value: //p[contains(text(), 'Affected Sectors')]/following-sibling::p
    wait_load: false
  stats_unique_value:
    type: text
    by: xpath
    value: //p[contains(text(), 'Unique Signatures')]/following-sibling::p
    wait_load: false
  filters_scope_dropdown:
    type: button
    by: xpath
    value: //button[contains(text(), 'Global Scope')]
    wait_load: false
  filters_project_item:
    type: button
    by: xpath
    value: //div[@role='menuitem']
    wait_load: false
  list_incident_summary:
    type: webelement
    by: xpath
    value: //div[contains(@class, 'glass-panel')]//div[contains(@class, 'cursor-pointer')]
    wait_load: false
  list_incident_timestamp:
    type: text
    by: xpath
    value: //time
    wait_load: false
  list_incident_message:
    type: text
    by: xpath
    value: //div[contains(@class, 'font-mono')]
    wait_load: false
  list_incident_frequency:
    type: text
    by: xpath
    value: //span[contains(text(), 'freq:')]
    wait_load: false
  list_incident_trend:
    type: text
    by: xpath
    value: //span[contains(text(), 'trend:')]
    wait_load: false
  list_incident_projects:
    type: text
    by: xpath
    value: //div[contains(@class, 'flex gap-2')]
    wait_load: false
  list_details_context:
    type: text
    by: xpath
    value: //div[contains(@class, 'bg-slate-950')]
    wait_load: false
  ai_analysis_text:
    type: text
    by: xpath
    value: //p[contains(@class, 'text-slate-300')]
    wait_load: false
  ai_confidence_value:
    type: text
    by: xpath
    value: //span[contains(text(), 'Confidence')]
    wait_load: false
  incident_expanded:
    type: webelement
    by: xpath
    value: //div[contains(@class, 'border-rose-500/40')]
    wait_load: false
  incident page structure:
    type: webelement
    by: css
    value: body
    wait_load: true
  incident_stats:
    type: webelement
    by: xpath
    value: //div[contains(@class, 'grid-cols-3')]
    wait_load: false
  project_dropdown:
    type: webelement
    by: xpath
    value: //button[contains(@class, 'w-[200px]')]
    wait_load: false
  incident_list_container:
    type: webelement
    by: xpath
    value: //div[contains(@class, 'space-y-4')]
    wait_load: false
