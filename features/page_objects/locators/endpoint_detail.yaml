endpoint_detail:
  back_button:
    type: button
    by: xpath
    value: //button[contains(., 'Back to Catalog')]
    wait_load: true
  open_report_button:
    type: button
    by: xpath
    value: //button[contains(., 'Open Full Report')]
    wait_load: false
  performance_card:
    type: webelement
    by: xpath
    value: "//h3[contains(., 'Performance Insights')]/ancestor::div[contains(@class, 'border-indigo-500/30')]"
    wait_load: false
  # Granular Metrics
  success_rate_number:
    type: text
    by: xpath
    value: "//div[contains(@class, 'bg-slate-950/50')]//p[contains(., 'Success Rate')]/preceding-sibling::div/span[contains(@class, 'text-2xl')]"
    wait_load: false
  avg_latency_number:
    type: text
    by: xpath
    value: "//div[contains(@class, 'bg-slate-950/50')]//p[contains(., 'Avg Latency')]/preceding-sibling::div/span[contains(@class, 'text-2xl')]"
    wait_load: false

  # Performance Insights (Granular)
  performance_report_timestamp:
    type: text
    by: xpath
    value: "//p[contains(., 'Latest Load Test Report')]"
    wait_load: false
  performance_total_requests:
    type: text
    by: xpath
    value: "//div[contains(., 'Total Requests')]/following-sibling::div[contains(@class, 'text-3xl')]"
    wait_load: false
  performance_rps:
    type: text
    by: xpath
    value: "//div[contains(., 'RPS (Load)')]/following-sibling::div[contains(@class, 'text-3xl')]"
    wait_load: false
  performance_p95_latency:
    type: text
    by: xpath
    value: "//div[contains(., 'P95 Latency')]/following-sibling::div[contains(@class, 'text-3xl')]"
    wait_load: false
  performance_failures:
    type: text
    by: xpath
    value: "//div[contains(., 'Failure Rate')]/following-sibling::div[contains(@class, 'text-3xl')]"
    wait_load: false
