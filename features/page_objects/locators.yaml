dashboard:
  header:
    title:
      by: xpath
      value: "//h1" # "Command Center"
    subtitle:
      by: xpath
      value: "//*[contains(normalize-space(.), 'Dashboard Cluster')]"
    qa_hub_text:
        by: xpath
        value: "//*[contains(normalize-space(.), 'Command Center')]"
  
  stats:
    pass_rate:
      by: xpath
      value: "//*[contains(normalize-space(.), 'Pass Rate')]"
    total_runs:
      by: xpath
      value: "//*[contains(normalize-space(.), 'Total Executions')]"
    avg_duration:
      by: xpath
      value: "//*[contains(normalize-space(.), 'Avg Latency')]"
    passed_card:
        by: xpath
        value: "//*[contains(normalize-space(.), 'System Health')]"
    failed_card:
        by: xpath
        value: "//*[contains(normalize-space(.), 'Incident Taxonomy')]"

  status_ticker:
    bar:
      by: css
      value: "div.animate-marquee"
    system_status:
      by: xpath
      value: "//span[contains(@class, 'tracking-[0.2em]')]" # Matches specifically the status span

  timeline:
    heading:
      by: xpath
      value: "//*[contains(normalize-space(.), 'Signal Velocity')]"
    chart:
      by: css
      value: ".recharts-wrapper"
    toggle_success:
       by: xpath
       value: "//button[contains(normalize-space(.), 'Stability')]"
    toggle_volume:
       by: xpath
       value: "//button[contains(normalize-space(.), 'Volume')]"

  recent_runs:
    heading:
      by: xpath
      value: "//*[contains(normalize-space(.), 'Sector Integrity')]"
    section:
        by: xpath
        value: "//div[contains(., 'Sector Integrity')]"
    list_item:
        by: xpath
        value: "//div[contains(., 'Sector Integrity')]/..//div[contains(@class, 'bg-slate-950/50')]"

  incidents:
    heading:
       by: xpath
       value: "//*[contains(normalize-space(.), 'Incident Taxonomy')]"
    list_item:
       by: xpath
       value: "//div[contains(., 'Incident Taxonomy')]/..//div[contains(@class, 'bg-slate-950/30')]"

  endpoints:
    heading:
      by: xpath
      value: "//*[contains(normalize-space(.), 'Latency Anomalies')]"
    catalog:
      by: xpath
      value: "//div[contains(., 'Latency Anomalies')]"

  actions:
    sync_button:
      by: xpath
      value: "//button[@aria-label='Sync Data']"
    filter_7_days:
      by: xpath
      value: "//button[@aria-label='7D Window']"
    filter_30_days:
      by: xpath
      value: "//button[@aria-label='30D Window']"
    filter_all_time:
      by: xpath
      value: "//button[@aria-label='Export Report']" # Mapping to export as temp fallback or remove
    export_button:
      by: xpath
      value: "//button[@aria-label='Export Report']"

sidebar:
  dashboard_link:
    by: xpath
    value: "//button[contains(., 'Dashboard')]"
  test_runs_link:
    by: xpath
    value: "//button[contains(., 'Test Runs')]"
  endpoints_link:
    by: xpath
    value: "//button[contains(., 'Endpoints')]"
  new_run_button:
    by: xpath
    value: "//button[contains(., 'New Run')]"

test_runs:
  title:
    by: xpath
    value: "//*[contains(text(), 'Execution Archives')]"
  search_input:
    by: xpath
    value: "//input[@placeholder='Search by project identifier, run ID, or tags...']"
  project_card:
    by: xpath
    value: "//div[contains(@class, 'rounded-3xl border transition-all')]"
  project_title:
    by: xpath
    value: "//h3[contains(@class, 'text-2xl font-black')]"
  delete_project_button:
    by: xpath
    value: "//button[contains(., 'Delete Project')]"
  latest_badge:
    by: xpath
    value: "//span[contains(., 'Latest')]"

run_detail:
  back_button:
    by: xpath
    value: "//button[contains(., 'Return to Base')]"
  export_pdf:
    by: xpath
    value: "//button[contains(., 'Export PDF Dossier')]"
  project_label:
    by: xpath
    value: "//span[contains(@class, 'text-indigo-500')]/.."
  score_percentage:
    by: xpath
    value: "//span[contains(@class, 'text-3xl font-black')]"
  filter_failed:
    by: xpath
    value: "//button[contains(., 'FAILED')]"
  scenario_card:
    by: xpath
    value: "//div[contains(@class, 'group bg-slate-900/40')]"

endpoints_view:
  title:
    by: xpath
    value: "//*[contains(text(), 'Endpoint Catalog')]"
  search_input:
    by: xpath
    value: "//input[@placeholder='Search by URL, project, or host...']"
  method_filter:
    by: xpath
    value: "//select"
  advanced_filters_toggle:
    by: xpath
    value: "//button[contains(., 'Filters')]"
  endpoint_item:
    by: xpath
    value: "//div[contains(@class, 'group flex flex-col md:flex-row')]"
