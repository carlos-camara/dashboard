[Driver]
headless: true
# Window size configuration (optional). If not specified and headless: false, 
# the browser will start maximized.
# window_width: 1920
# window_height: 1080

# type: chrome | firefox | edge
type: chrome

# Manual paths (optional). If not specified, the framework will 
# automatically download the driver to features/drivers/
# gecko_driver_path: C:\Drivers\geckodriver.exe
# chrome_driver_path: C:\Drivers\chromedriver.exe
# edge_driver_path: C:\Drivers\msedgedriver.exe

# Note: Automatic downloads go to features/drivers/

[VisualTests]
# Enable visual regression testing
enabled: true
# If true, test will FAIL if visual mismatch is detected
fail: true
# If true, current screenshot replaces the baseline (use for seeding)
save: false
# Prefix for baseline images (e.g., 'chrome' to separate by browser)
baseline_name: {Driver_type}
