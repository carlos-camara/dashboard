---
name: Unified Test Suite

on:
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  tests:
    name: Unified Test Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: carlos-camara/qa-hub-actions/setup-environment@main
        with:
          python-version: "3.11"
          node-version: "20"

      - name: Prep Infrastructure
        uses: carlos-camara/qa-hub-actions/environment-health-check@main
        with:
          task: 'setup'
          start-services-command: >-
            npm run start-backend > backend.log 2>&1 &
            npm run dev > frontend.log 2>&1 &
          health-check-urls: >-
            http://localhost:3000
            http://localhost:3001/api/health
          db-path: "data/database.sqlite"
          ports-to-clean: "3000 3001"

      - name: Execute Test Suite
        uses: carlos-camara/qa-hub-actions/run-tests@main
        with:
          test-command-api: "qa-hub run --env staging --tags api"
          test-command-performance: >-
            locust -f features/dashboard/performance/locustfile.py --headless
            -u 10 -r 2 -t 1m --host http://localhost:3001
          test-command-gui: "qa-hub run --env staging --tags gui"
          headless: "true"

      - name: Collect & Publish
        if: always()
        uses: carlos-camara/qa-hub-actions/collect-and-publish@main
        with:
          reports-path: "reports/test_run"
          screenshots-path: "features/resources/screenshots/*.png"
          performance-reports-path: "reports/performance_run/"
          upload-artifacts: true
          publish-results: true

      - name: Publish PR Results
        if: always()
        uses: carlos-camara/qa-hub-actions/publish-test-results@main
        with:
          reports-path: "junit-results"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target: "description"

      - name: Environment Teardown
        if: always()
        uses: carlos-camara/qa-hub-actions/environment-health-check@main
        with:
          task: 'teardown'
          ports-to-clean: "3000 3001"

