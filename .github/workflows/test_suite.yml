name: Unified Test Suite

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  api-tests:
    name: Run Behave API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API Tests
        shell: pwsh
        run: |
          ./run_api_smoke_reports.ps1

      - name: Upload API Reports
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: reports/

  gui-tests:
    name: Run Dashboard + GUI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Start Dashboard Services
        run: |
          npm run start-backend > backend.log 2>&1 &
          npm run dev > frontend.log 2>&1 &
          
      - name: Wait for Dashboard to be ready
        run: |
          npx wait-on http://localhost:3000 http://localhost:3001/api/health --timeout 60000 || (cat backend.log && cat frontend.log && exit 1)

      - name: Run GUI Tests
        shell: pwsh
        run: |
          ./run_gui_smoke_reports.ps1
        env:
          HEADLESS: "true"

      - name: Upload GUI Reports
        uses: actions/upload-artifact@v4
        with:
          name: gui-reports
          path: reports/

      - name: Upload GUI Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: features/resources/screenshots/*.png

