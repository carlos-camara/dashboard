name: Unified Test Suite

on:
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  tests:
    name: Unified Test Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: carlos-camara/qa-hub-actions/setup-environment@main
        with:
          python-version: "3.11"
          node-version: "20"

      - name: Execute Test Suite
        uses: carlos-camara/qa-hub-actions/run-tests@main
        with:
          start-services-command: "npm run start-backend > backend.log 2>&1 & npm run dev > frontend.log 2>&1 &"
          health-check-urls: "http://localhost:3000 http://localhost:3001/api/health"
          test-command-api: "./run_api_smoke_reports.ps1"
          test-command-performance: "./run_load_test.ps1"
          test-command-gui: "./run_gui_smoke_reports.ps1"
          run-api: true
          run-performance: true
          run-gui: true
          headless: "true"

      - name: Collect & Publish
        if: always()
        uses: carlos-camara/qa-hub-actions/collect-and-publish@main
        with:
          reports-path: "reports/test_run"
          screenshots-path: "features/resources/screenshots/*.png"
          performance-reports-path: "reports/performance_run/"
          upload-artifacts: true
          publish-results: true

