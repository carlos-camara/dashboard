name: Unified Test Suite

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  tests:
    name: Unified Test Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Start Dashboard Services
        run: |
          npm run start-backend > backend.log 2>&1 &
          npm run dev > frontend.log 2>&1 &
          
      - name: Wait for Dashboard to be ready
        run: |
          npx wait-on http://localhost:3000 http://localhost:3001/api/health --timeout 60000 || (cat backend.log && cat frontend.log && exit 1)

      - name: Run API Tests
        shell: pwsh
        run: |
          ./run_api_smoke_reports.ps1
          # Stash API reports for later upload
          cp -r reports api_reports_tmp
          # Clear reports for the next specific run
          # rm -rf reports/test_run

      - name: Run GUI Tests
        shell: pwsh
        run: |
          ./run_gui_smoke_reports.ps1
        env:
          HEADLESS: "true"

      - name: Run Performance Tests
        shell: pwsh
        run: |
          ./run_load_test.ps1

      - name: Collect All JUnit XMLs
        if: always()
        shell: bash
        run: |
          mkdir -p junit-results
          if [ -d "api_reports_tmp" ]; then
            find api_reports_tmp -name "*.xml" -exec cp {} junit-results/ \;
          fi
          if [ -d "reports" ]; then
            find reports -name "*.xml" -exec cp {} junit-results/ \;
          fi
          echo "Collected $(find junit-results -maxdepth 1 -name "*.xml" | wc -l) XML files."

      - name: Upload API Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: api_reports_tmp/

      - name: Upload GUI Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-reports
          path: reports/

      - name: Upload GUI Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: features/resources/screenshots/*.png

      - name: Upload Performance Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: reports/performance_run/

      - name: Publish Test Results (PR)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unified Test Report
          path: junit-results/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Generate Job Summary
        if: always()
        run: |
          {
            echo "### 🚦 Test Suite Summary"
            echo "| Test Type | Status |"
            echo "| :--- | :--- |"
            if [ -d "api_reports_tmp" ]; then
              echo "| 📡 API Tests | ✅ Completed |"
            else
              echo "| 📡 API Tests | ❌ Failed |"
            fi
            if [ -d "reports" ]; then
              echo "| 🌐 GUI Tests | ✅ Completed |"
            else
              echo "| 🌐 GUI Tests | ❌ Failed |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

