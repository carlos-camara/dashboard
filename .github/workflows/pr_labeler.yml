name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Auto Label PR
        uses: carlos-camara/qa-hub-actions/pr-labeler@main
        with:
          sync-labels: true
