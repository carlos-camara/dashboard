---
name: "QA - Nightly Regression"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  full-regression:
    name: "Full Regression Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔧 Setup Environment"
        uses: carlos-camara/qa-hub-actions/setup-environment@main
        with:
          python-version: "3.11"
          node-version: "20"

      - name: "⚙️ Prep Infrastructure"
        uses: carlos-camara/qa-hub-actions/environment-health-check@main
        with:
          task: "setup"
          start-services-command: >-
            npm run start-backend > backend.log 2>&1 &
            npm run dev > frontend.log 2>&1 &
          health-check-urls: >-
            http://localhost:3000
            http://localhost:3001/api/health
          db-path: "data/database.sqlite"
          ports-to-clean: "3000 3001"

      - name: "🧪 Run Full Test Suite"
        uses: carlos-camara/qa-hub-actions/run-tests@main
        with:
          test-command-api: "qa-hub run --env staging --tags api"
          test-command-gui: "qa-hub run --env staging --tags gui"
          headless: "true"

      - name: "☁️ Deploy Reports to S3"
        if: always()
        uses: carlos-camara/qa-hub-actions/deploy-reports-s3@main
        with:
          project-name: "dashboard"
          s3-bucket: ${{ secrets.AWS_S3_BUCKET }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          upload-reports: "true"
          upload-screenshots: "true"

      - name: "📢 Slack Notification"
        uses: carlos-camara/qa-hub-actions/slack-notify@main
        if: always()
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status }}
