name: Sync Reports from S3

on:
  workflow_run:
    workflows: ["Deploy Reports to S3"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-s3:
    name: Sync S3 Reports to Main
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Reports from S3
        uses: carlos-camara/qa-hub-actions/sync-from-s3@main
        with:
          project-name: "dashboard"
          s3-bucket: ${{ secrets.AWS_S3_BUCKET }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          target-path: "reports/test_run"
          s3-path: "reports/test_run"
          commit-message: "chore: sync reports from S3 [skip ci]"
          branch: "main"
