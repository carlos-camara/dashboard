name: Sync Reports from S3

on:
  workflow_run:
    workflows: ["Deploy Reports to S3"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch to commit reports to'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  sync-s3:
    name: Sync S3 Reports to Branch
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: 📍 Determine Target Branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BRANCH="${{ github.event.inputs.branch }}"
          else
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          fi
          echo "target=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "📍 Target branch: ${BRANCH}"

      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.branch.outputs.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch all history to enable branch tracking
      
      - name: 🔗 Setup Branch Tracking
        run: |
          BRANCH="${{ steps.branch.outputs.target }}"
          git checkout -B "${BRANCH}" "origin/${BRANCH}"
          echo "✅ Now on branch: $(git branch --show-current)"

      - name: 🔄 Sync Reports from S3
        uses: carlos-camara/qa-hub-actions/sync-from-s3@v1.1.3
        with:
          project-name: "dashboard"
          s3-bucket: ${{ secrets.AWS_S3_BUCKET }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          target-path: "reports/test_run"
          s3-path: "reports/test_run"
          commit-message: "chore: sync reports from S3 [skip ci]"
          branch: ${{ steps.branch.outputs.target }}