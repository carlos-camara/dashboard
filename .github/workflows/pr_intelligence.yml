---
name: PR Intelligence

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.actor == 'carlos-camara' ||
      github.actor == 'dependabot[bot]'

    steps:
      - name: 📝 Validate PR Hygiene
        if: github.actor != 'dependabot[bot]'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "📝 Validating PR standards..."
          
          # 1. Validate Title (Conventional Commits)
          REGEX="^(feat|fix|chore|docs|style|refactor|test|perf)(\(.*\))?!?: .+$"
          if [[ ! "$TITLE" =~ $REGEX ]]; then
            MSG="❌ **Invalid PR Title**: Please use [Conventional Commits](https://www.conventionalcommits.org/) (e.g., \`feat: add sync logic\`)."
            echo "$MSG"
            gh pr comment "$PR_NUMBER" --body "$MSG" --repo "$REPO"
            exit 1
          fi
          
          # 2. Validate Description
          if [ -z "$BODY" ] || [ ${#BODY} -lt 15 ]; then
            MSG="❌ **Incomplete Description**: Please provide a detailed description of your changes (>15 characters)."
            echo "$MSG"
            gh pr comment "$PR_NUMBER" --body "$MSG" --repo "$REPO"
            exit 1
          fi
          
          echo "✅ PR Hygiene standards met."

      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🏷️ Auto Label PR
        uses: carlos-camara/qa-hub-actions/pr-labeler@main
        with:
          sync-labels: true

      - name: 📏 Label PR by Size
        if: github.actor != 'dependabot[bot]'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "📏 Calculating PR size..."
          DIFF_LINES=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | awk '{print $4 + $6}')
          
          if [ -z "$DIFF_LINES" ]; then DIFF_LINES=0; fi
          echo "Lines changed: $DIFF_LINES"
          
          if [ "$DIFF_LINES" -lt 50 ]; then
            SIZE="size/S"
            COLOR="0E8A16" # Green
          elif [ "$DIFF_LINES" -lt 200 ]; then
            SIZE="size/M"
            COLOR="FBCA04" # Yellow
          elif [ "$DIFF_LINES" -lt 500 ]; then
            SIZE="size/L"
            COLOR="EB6420" # Orange
          else
            SIZE="size/XL"
            COLOR="D93F0B" # Red
          fi
          
          echo "Target Label: $SIZE"
          
          # Create labels if they don't exist
          gh label create "size/S" --color "0E8A16" --description "Quick review (< 50 lines)" --repo "$REPO" --force || true
          gh label create "size/M" --color "FBCA04" --description "Standard review (50-200 lines)" --repo "$REPO" --force || true
          gh label create "size/L" --color "EB6420" --description "Deep review (200-500 lines)" --repo "$REPO" --force || true
          gh label create "size/XL" --color "D93F0B" --description "Significant change (> 500 lines)" --repo "$REPO" --force || true
          
          # Remove previous size labels to avoid duplication
          EXISTING_LABELS=$(gh pr view "$PR_NUMBER" --json labels --template '{{range .labels}}{{.name}} {{end}}')
          for L in $EXISTING_LABELS; do
            if [[ $L == size/* ]]; then
              gh pr edit "$PR_NUMBER" --remove-label "$L" --repo "$REPO"
            fi
          done
          
          # Add the new size label
          gh pr edit "$PR_NUMBER" --add-label "$SIZE" --repo "$REPO"
          echo "✅ Applied $SIZE label to PR #$PR_NUMBER"

      - name: 🤖 Perform Risk Analysis
        if: github.actor != 'dependabot[bot]'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "🤖 Analyzing risk..."
          CRITICAL_PATTERNS=("server.js" "services/db.js" ".github/workflows/" "package.json" "package-lock.json")
          RISK_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          IS_HIGH_RISK=false
          MATCHED_FILES=""
          
          for file in $RISK_FILES; do
            for pattern in "${CRITICAL_PATTERNS[@]}"; do
              if [[ $file == *"$pattern"* ]]; then
                echo "⚠️ Critical file modified: $file"
                IS_HIGH_RISK=true
                MATCHED_FILES="${MATCHED_FILES}- \`$file\`\n"
              fi
            done
          done
          
          if [ "$IS_HIGH_RISK" = true ]; then
            echo "Classification: HIGH RISK"
            gh label create "high-risk" --color "B60205" --description "Critical system files modified" --repo "$REPO" --force || true
            gh pr edit "$PR_NUMBER" --add-label "high-risk" --repo "$REPO"
            
            # Prepare warning for PR summary
            WARNING="> [!CAUTION]\n> ### ⚠️ HIGH RISK CHANGE DETECTED\n> This PR modifies critical system files:\n${MATCHED_FILES}\n---\n"
            
            CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body --template '{{.body}}')
            # Inject at top if not already present
            if [[ "$CURRENT_BODY" != *"!CAUTION"* ]]; then
              echo -e "$WARNING\n$CURRENT_BODY" > new_body.md
              gh pr edit "$PR_NUMBER" --body-file new_body.md --repo "$REPO"
            fi
          else
            echo "Classification: Standard Risk"
            gh pr edit "$PR_NUMBER" --remove-label "high-risk" --repo "$REPO" || true
          fi

      - name: 👤 Auto Assign PR
        if: github.actor != 'dependabot[bot]'
        run: gh pr edit "$PR_NUMBER" --add-assignee "$ASSIGNEE" --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSIGNEE: ${{ github.actor }}
          REPO: ${{ github.repository }}

      - name: 🎯 Auto Milestone PR
        if: github.actor != 'dependabot[bot]'
        uses: carlos-camara/qa-hub-actions/pr-milestoner@v1.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          strategy: "latest_created"

      - name: ✨ Generate PR Summary
        if: github.actor != 'dependabot[bot]'
        uses: carlos-camara/qa-hub-actions/pr-summarizer@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target: "description"
