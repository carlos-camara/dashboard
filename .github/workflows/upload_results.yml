name: Upload Test Results

on:
  workflow_run:
    workflows: ["Unified Test Suite"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the Unified Test Suite to process'
        required: false
        type: string

jobs:
  upload-results:
    name: Merge and Commit Reports
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Download Test Reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports_for_upload
          github-token: ${{ github.token }}
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}

      - name: Download GUI Screenshots
        uses: actions/download-artifact@v4
        with:
          name: gui-screenshots
          path: reports_for_upload/screenshots
          github-token: ${{ github.token }}
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}

      - name: Download Performance Reports
        uses: actions/download-artifact@v4
        with:
          name: performance-reports
          path: reports_for_upload/performance_run
          github-token: ${{ github.token }}
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}

      - name: Collect & Publish
        uses: carlos-camara/qa-hub-actions/collect-and-publish@main
        with:
          reports-path: "reports_for_upload"
          screenshots-path: "reports_for_upload/screenshots/*.png"
          performance-reports-path: "reports_for_upload/performance_run/"
          upload-artifacts: false # Already uploaded by main suite or S3 job
          publish-results: true
