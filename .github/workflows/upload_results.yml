---
name: Upload Test Results

on:
  workflow_run:
    workflows: ["Unified Test Suite"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the Unified Test Suite to process'
        required: false
        type: string

jobs:
  upload-results:
    name: Merge and Commit Reports
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && 
      github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event.workflow_run.head_branch || 
            github.ref_name }}

      - name: Merge and Commit Results
        uses: carlos-camara/qa-hub-actions/upload-results@main
        with:
          run-id: >-
            ${{ github.event.workflow_run.id || 
            github.event.inputs.run_id }}
          branch: >-
            ${{ github.event.workflow_run.head_branch || 
            github.ref_name }}
          upload-reports: 'true'
          upload-perf: 'true'

      - name: Download Artifacts for Summary
        uses: actions/download-artifact@v7
        with:
          name: test-reports
          path: temp_junit
          github-token: ${{ github.token }}
          run-id: >-
            ${{ github.event.workflow_run.id || 
            github.event.inputs.run_id }}

      - name: Publish Test Summary
        uses: carlos-camara/qa-hub-actions/collect-and-publish@main
        with:
          reports-path: "temp_junit"
          upload-artifacts: false
          publish-results: true
