name: Upload Test Results

on:
  workflow_run:
    workflows: ["Unified Test Suite"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the Unified Test Suite to process'
        required: false
        type: string

jobs:
  upload-results:
    name: Merge and Commit Reports
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Publish Results to Repo
        uses: carlos-camara/qa-hub-actions/upload-results@main
        with:
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
          branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          upload-api: false
