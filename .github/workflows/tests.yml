name: Tests - Behave SMOKE

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write         # Needed to push reports
  checks: write          # needed to publish the test report as a Check
  pull-requests: write   # optional but useful for PR annotations/comments

jobs:
  behave:
    name: Run Behave + Publish Test Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Tests via PowerShell
        shell: pwsh
        run: |
          ./run_reports.ps1

      - name: Commit and Push Reports
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes in reports to commit."
          else
            git commit -m "docs: auto-generate smoke test report [skip ci]"
            git push origin HEAD:$HEAD_REF
          fi

      # Publishes a nice summary:
      - name: Publish Test Report (JUnit)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Behave - API Test Report
          path: reports/**/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload JUnit reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behave-junit-reports
          path: reports/
          if-no-files-found: warn
