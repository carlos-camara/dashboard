name: Deploy Reports to S3

on:
  workflow_run:
    workflows: ["Unified Test Suite"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the Unified Test Suite to process'
        required: false
        type: string
      upload_reports:
        description: 'Upload test reports (consolidated)?'
        required: false
        default: 'true'
        type: string
      upload_screenshots:
        description: 'Upload GUI screenshots?'
        required: false
        default: 'true'
        type: string
      upload_perf:
        description: 'Upload Performance reports?'
        required: false
        default: 'true'
        type: string

jobs:
  deploy-s3:
    name: Sync Reports to S3
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC if we ever upgrade, but good practice
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy QA Reports to S3
        uses: carlos-camara/qa-hub-actions/deploy-reports-s3@main
        with:
          project-name: "dashboard"
          s3-bucket: ${{ secrets.AWS_S3_BUCKET }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
          upload-reports: ${{ github.event.inputs.upload_reports || 'true' }}
          upload-screenshots: ${{ github.event.inputs.upload_screenshots || 'true' }}
          upload-perf: ${{ github.event.inputs.upload_perf || 'true' }}
